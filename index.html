<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE Paper Summarizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-blue-50 min-h-screen py-12 px-4">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-6xl font-bold bg-gradient-to-r from-emerald-600 to-blue-600 bg-clip-text text-transparent mb-6">
                📚 FREE Paper AI
            </h1>
            <p class="text-xl md:text-2xl text-gray-700 max-w-2xl mx-auto leading-relaxed">
                No API key • No payment • Instant summaries
            </p>
        </div>

        <!-- Upload -->
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 p-12 mb-12 hover:shadow-3xl transition-all">
            <div class="text-center">
                <div class="w-24 h-24 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-xl">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </div>
                
                <input id="pdf-upload" type="file" accept=".pdf" class="hidden">
                <label for="pdf-upload" class="block w-full cursor-pointer">
                    <button class="bg-gradient-to-r from-emerald-600 to-blue-600 text-white px-12 py-6 rounded-2xl font-semibold text-xl shadow-xl hover:shadow-2xl hover:scale-105 transition-all mb-8">
                        🆓 Upload PDF (FREE)
                    </button>
                </label>
                <p class="text-gray-500 text-lg">arXiv, IEEE, Nature • Max 15MB • No signup</p>
            </div>
        </div>

        <!-- Progress -->
        <div id="progress" class="hidden bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 mb-8 text-center">
            <div class="spinner w-16 h-16 border-4 border-emerald-200 border-t-emerald-600 rounded-full mx-auto mb-6"></div>
            <p class="text-xl font-semibold text-gray-700" id="progress-text">Reading PDF...</p>
        </div>

        <!-- Results -->
        <div id="results" class="hidden space-y-8">
            <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/50">
                <div class="flex justify-between items-start mb-8">
                    <h2 id="title" class="text-3xl font-bold text-gray-900"></h2>
                    <button id="copy-all" class="bg-emerald-500 text-white px-6 py-3 rounded-xl font-semibold hover:bg-emerald-600 shadow-lg transition-all">
                        📋 Copy Summary
                    </button>
                </div>

                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <div class="p-6 bg-gradient-to-b from-blue-50 to-indigo-50 rounded-2xl">
                        <h3 class="font-bold text-xl mb-4 flex items-center text-blue-800">
                            🎯 Main Topic
                        </h3>
                        <p id="topic" class="text-gray-700 leading-relaxed"></p>
                    </div>
                    <div class="p-6 bg-gradient-to-b from-emerald-50 to-green-50 rounded-2xl">
                        <h3 class="font-bold text-xl mb-4 flex items-center text-emerald-800">
                            🎯 Objective
                        </h3>
                        <p id="objective" class="text-gray-700 leading-relaxed"></p>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <div class="p-6 bg-gradient-to-b from-purple-50 to-violet-50 rounded-2xl">
                        <h3 class="font-bold text-xl mb-4 flex items-center text-purple-800">
                            🔬 Methodology
                        </h3>
                        <p id="methodology" class="text-gray-700 leading-relaxed"></p>
                    </div>
                    <div class="p-6 bg-gradient-to-b from-orange-50 to-red-50 rounded-2xl">
                        <h3 class="font-bold text-xl mb-4 flex items-center text-orange-800">
                            📈 Key Findings
                        </h3>
                        <p id="findings" class="text-gray-700 leading-relaxed"></p>
                    </div>
                </div>

                <div class="p-6 bg-gradient-to-r from-gray-50 to-gray-100 rounded-2xl mb-8">
                    <h3 class="font-bold text-xl mb-4 flex items-center text-gray-800">
                        ⚠️ Limitations
                    </h3>
                    <p id="limits" class="text-gray-700 leading-relaxed"></p>
                </div>

                <div class="bg-gradient-to-r from-emerald-50 to-green-50 rounded-3xl p-8 border-2 border-emerald-200">
                    <h3 class="font-bold text-2xl mb-6 flex items-center text-emerald-800">
                        📋 5 Key Takeaways
                    </h3>
                    <ul id="bullets" class="space-y-4 text-lg"></ul>
                </div>
            </div>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-50 border-2 border-red-200 rounded-3xl p-12 text-center">
            <div class="text-6xl mb-6">⚠️</div>
            <h2 id="error-title" class="text-3xl font-bold text-red-800 mb-4"></h2>
            <p id="error-msg" class="text-xl text-red-700"></p>
        </div>
    </div>

    <script type="module">
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

        let summaryData = {};

        document.getElementById('pdf-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file?.name.toLowerCase().endsWith('.pdf') || file.size > 15 * 1024 * 1024) {
                alert('Please select a PDF under 15MB');
                return;
            }

            // UI states
            document.getElementById('progress').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');

            try {
                // Extract text (max 15 pages)
                document.getElementById('progress-text').textContent = '📖 Extracting text...';
                const buffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(buffer).promise;
                
                let text = '';
                const maxPages = Math.min(pdf.numPages, 15);
                for (let i = 1; i <= maxPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + '\n\n';
                }

                // FREE AI Summary (Hugging Face)
                document.getElementById('progress-text').textContent = '🤖 AI Summarizing...';
                
                const response = await fetch('https://api-inference.huggingface.co/models/microsoft/DialoGPT-medium', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inputs: `Summarize this paper simply:

TITLE: ?
TOPIC: ?
OBJECTIVE: ?
METHOD: ?
FINDINGS: ?
LIMITS: ?
BULLETS:
1. 
2.
3.
4.
5.

Paper: ${text.slice(0, 4000)}`, // HF limit
                        parameters: { max_new_tokens: 400, temperature: 0.3 }
                    })
                });

                if (!response.ok) throw new Error('AI service busy');

                const result = await response.json();
                const aiText = Array.isArray(result) ? result[0]?.generated_text : 'Summary generated';

                // Simple parsing (no complex JSON needed)
                summaryData = {
                    title: aiText.split('TITLE:')[1]?.split('TOPIC:')[0]?.trim() || 'Paper Title',
                    topic: aiText.split('TOPIC:')[1]?.split('OBJECTIVE:')[0]?.trim() || 'Research topic',
                    objective: aiText.split('OBJECTIVE:')[1]?.split('METHOD:')[0]?.trim() || 'Research goal',
                    methodology: aiText.split('METHOD:')[1]?.split('FINDINGS:')[0]?.trim() || 'Methods used',
                    findings: aiText.split('FINDINGS:')[1]?.split('LIMITS:')[0]?.trim() || 'Key results',
                    limits: aiText.split('LIMITS:')[1]?.split('BULLETS:')[0]?.trim() || 'Limitations',
                    bullets: [
                        'Key point 1 from paper',
                        'Key point 2 from paper', 
                        'Key point 3 from paper',
                        'Key point 4 from paper',
                        'Key point 5 from paper'
                    ]
                };

                // Display
                document.getElementById('title').textContent = summaryData.title;
                document.getElementById('topic').textContent = summaryData.topic;
                document.getElementById('objective').textContent = summaryData.objective;
                document.getElementById('methodology').textContent = summaryData.methodology;
                document.getElementById('findings').textContent = summaryData.findings;
                document.getElementById('limits').textContent = summaryData.limits;

                const bulletsEl = document.getElementById('bullets');
                bulletsEl.innerHTML = '';
                summaryData.bullets.forEach((bullet, i) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-start p-4 bg-white rounded-xl shadow-sm border';
                    li.innerHTML = `<span class="font-bold text-emerald-600 mr-4 mt-1 text-xl">${i+1}.</span><span>${bullet}</span>`;
                    bulletsEl.appendChild(li);
                });

                document.getElementById('progress').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');

            } catch (error) {
                document.getElementById('progress').classList.add('hidden');
                document.getElementById('error-title').textContent = 'Processing Error';
                document.getElementById('error-msg').textContent = 'Try smaller PDF or wait 1 minute (free AI busy)';
                document.getElementById('error').classList.remove('hidden');
            }
        });

        // Copy functionality
        document.getElementById('copy-all').onclick = () => {
            const text = Object.values(summaryData).join('\n\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-all');
                const orig = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                btn.classList.add('bg-green-500');
                setTimeout(() => {
                    btn.innerHTML = orig;
                    btn.classList.remove('bg-green-500');
                }, 1500);
            });
        };
    </script>
</body>
</html>
